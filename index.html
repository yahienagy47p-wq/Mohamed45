<!DOCTYPE html>

  <meta charset="UTF-8">

  <style>
    :root { color-scheme: dark; --bg:#080808; --line:#292929; --text:#f7f7f7; --muted:#a4a4a4; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100svh; padding: 28px 18px;
      display: grid; place-items: center; color: var(--text);
      background: radial-gradient(ellipse at 50% 0%, #202020 0%, #0c0c0c 42%, var(--bg) 75%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
    .page { width: 100%; max-width: 420px; text-align: center; }
    .avatar {
      width: 94px; height: 94px; margin: 0 auto 18px; border-radius: 50%;
      display: grid; place-items: center; border: 1px solid #454545;
      background: linear-gradient(145deg, #292929, #101010);
      box-shadow: 0 0 0 7px #ffffff08, 0 12px 36px #0009;
      font-size: 30px; font-weight: 800; letter-spacing: -2px;
    }
    h1 { margin: 0; font-size: clamp(25px, 7vw, 32px); letter-spacing: .2px; }
    .subtitle { margin: 8px 0 25px; color: var(--muted); font-size: 14px; }
    .links { display: grid; gap: 12px; }
    .link {
      min-height: 66px; display: flex; align-items: center; gap: 14px;
      padding: 12px 16px; border: 1px solid var(--line); border-radius: 17px;
      background: linear-gradient(110deg, #171717, #101010);
      color: var(--text); text-decoration: none; text-align: right;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .link:active { transform: scale(.98); }
    .link:hover { border-color: #555; background: #1b1b1b; }
    .icon { width: 42px; height: 42px; flex: 0 0 42px; display: grid; place-items: center; border-radius: 12px; }
    .icon svg { width: 25px; height: 25px; fill: currentColor; }
    .instagram .icon { color: white; background: linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045); }
    .tiktok .icon { color: white; background: #222; border: 1px solid #3b3b3b; }
    .facebook .icon { color: white; background: #1877f2; }
    .whatsapp .icon { color: white; background: #20a85a; }
    .copy { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
    .name { font-size: 16px; font-weight: 700; }
    .handle { color: var(--muted); font-size: 12px; direction: ltr; text-align: right; overflow-wrap: anywhere; }
    .arrow { color: #777; font-size: 21px; }
    .footer { color: #666; font-size: 11px; margin-top: 28px; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
